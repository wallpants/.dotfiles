# Consulted when a file:// hyperlink is clicked in the terminal (e.g. from
# `ls --hyperlink` / eza) and for `kitten @ open`.
# OS-initiated opens (Finder, Dock drops) go through launch-actions.conf.

# Directories: new tab with a shell at that path
protocol file
mime inode/directory
action launch --type=tab --cwd=${FILE_PATH}

# Anything else: new tab running nvim
protocol file
action launch --type=tab nvim -- ${FILE_PATH}

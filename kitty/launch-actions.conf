# Consulted when the OS asks kitty to open a file: Finder "Open With",
# dragging onto the Dock icon, `open -a kitty <path>`.
# Clicked file:// hyperlinks in the terminal go through open-actions.conf.

# Directories: new tab with a shell at that path
protocol file
mime inode/directory
action launch --type=tab --cwd=${FILE_PATH}

# Anything else: new tab running nvim
protocol file
action launch --type=tab zsh -lic 'cd -- "$(dirname "$1")" && nvim -- "$1"' zsh ${FILE_PATH}
